<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css?v=20261110c">
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <div id="obj"><div class="lbl">NHIỆM VỤ</div><div id="obj-text"></div></div>
    <div id="inv"></div>
    <div id="hud-right">
      <button id="btn-pause" title="Tạm dừng (Esc)"><span></span><span></span></button>
    </div>
    <button id="btn-hint" title="Gợi ý (H)">?</button>
  </div>

  <div id="tip"></div>
  <div id="overlay" class="hidden"></div>

  <div id="dialog" class="hidden">
    <img id="d-fig" alt="">
    <div id="d-box">
      <img id="d-frame" alt="">
      <div id="d-name"></div>
      <div id="d-text"></div>
      <div id="d-next">Space ▸</div>
    </div>
  </div>

  <video id="video" playsinline preload="auto" class="hidden"></video>
  <div id="vskip" class="hidden">Space / Click: bỏ qua</div>

  <div id="screen" class="hidden"></div>
  <div id="toast"></div>
  <div id="fade"></div>
  <div id="loading"><div>ĐANG TẢI</div><div id="load-bar"><div id="load-fill"></div></div></div>
</div>
<script src="outlines.js?v=20261110c"></script>
<script src="game.js?v=20261110c"></script>
</body>
</html>
